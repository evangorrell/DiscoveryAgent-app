[project]
name = "da-selection-ui"
version = "0.1.0"
requires-python = "==3.11.*"

dependencies = [
    "anthropic==0.54.0",
    "claude-agent-sdk==0.2.131",
    "Flask==3.0.0",
    "Flask-Session==0.5.0",
    "gxl-paperclip==0.7.24",
    "markdown==3.6",
    "openai==1.95.1",
    "psutil>=5.9.0",
    "python-dotenv==1.0.1",
    "requests>=2.32.0",
    "send2trash==2.1.0",
]

[project.optional-dependencies]
hosted = ["gunicorn==22.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["da_selection_ui", "AIR"]

[tool.uv.sources]
AIR = { path = "./AIR", editable = true}
gxl-paperclip = { path = "vendor/gxl_paperclip-0.7.24-py3-none-any.whl" }
