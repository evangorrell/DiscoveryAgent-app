[project]
name = "da-selection-ui"
version = "0.1.0"
requires-python = "==3.11.*"

dependencies = [
    "anthropic==0.54.0",
    "claude-agent-sdk==0.1.18",
    "Flask==3.0.0",
    "Flask-Session==0.5.0",
    "markdown==3.6",
    "openai==1.95.1",
    "psutil>=5.9.0",
    "psycopg2-binary==2.9.10",
    "python-dotenv==1.0.1",
    "requests>=2.32.0",
    "send2trash==2.1.0",
    "sqlalchemy==2.0.37",
]

[project.optional-dependencies]
hosted = ["gunicorn==22.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["da_selection_ui", "AIR"]

[tool.hatch.build.targets.wheel.force-include]
"da_selection_ui/guides/AUDIT_UI.md" = "da_selection_ui/guides/AUDIT_UI.md"

[tool.uv.sources]
AIR = { path = "./AIR", editable = true}
