<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkpoints | Discovery Agent</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        .cb-layout {
            display: flex;
            height: calc(100vh - 52px);
            overflow: hidden;
        }
        .cb-sidebar {
            width: 280px;
            min-width: 200px;
            border-right: 1px solid var(--border-color);
            overflow-y: auto;
            padding: 12px 0;
            background: var(--card-background);
        }
        .cb-content {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px;
            background: var(--background);
        }
        .cb-tree-item {
            display: flex;
            align-items: center;
            padding: 4px 12px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-primary);
            white-space: nowrap;
            user-select: none;
            border-radius: 4px;
            margin: 0 6px;
        }
        .cb-tree-item:hover {
            background: var(--border-light);
        }
        .cb-tree-item.active {
            background: rgba(99, 102, 241, 0.08);
            color: var(--accent-color);
        }
        .cb-tree-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            font-size: 10px;
            color: var(--text-muted);
            flex-shrink: 0;
            transition: transform 0.15s ease;
        }
        .cb-tree-toggle.open {
            transform: rotate(90deg);
        }
        .cb-tree-icon {
            margin-right: 6px;
            font-size: 14px;
            flex-shrink: 0;
        }
        .cb-tree-label {
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .cb-tree-children {
            display: none;
        }
        .cb-tree-children.open {
            display: block;
        }
        .cb-breadcrumb {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            word-break: break-all;
        }
        .cb-empty {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            font-size: 15px;
        }
        .cb-file-content {
            background: var(--card-background);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow-sm);
        }
        .cb-file-content .markdown-body {
            font-size: 15px;
            line-height: 1.7;
        }
        .cb-file-content pre {
            background: #f6f8fa;
            border-radius: var(--radius-sm);
            padding: 16px;
            overflow-x: auto;
            font-size: 13px;
            line-height: 1.5;
        }
        .cb-file-content .cb-plain {
            white-space: pre-wrap;
            font-family: 'SF Mono', 'Fira Code', 'Fira Mono', Menlo, monospace;
            font-size: 13px;
            line-height: 1.5;
        }
        .cb-truncated {
            margin-top: 12px;
            padding: 10px 14px;
            background: #fffbeb;
            border: 1px solid #fcd34d;
            border-radius: var(--radius-sm);
            font-size: 13px;
            color: #92400e;
        }
        .cb-error {
            color: var(--danger-color);
            padding: 20px;
            text-align: center;
        }
        .cb-loading {
            color: var(--text-muted);
            padding: 20px;
            text-align: center;
        }
        .cb-sidebar-header {
            padding: 4px 18px 10px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }
        .cb-guide-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(0,0,0,0.4);
            align-items: center;
            justify-content: center;
        }
        .cb-guide-overlay.open {
            display: flex;
        }
        .cb-guide-modal {
            background: var(--card-background);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            width: 720px;
            max-width: 90vw;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .cb-guide-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
        }
        .cb-guide-header h2 {
            margin: 0;
            font-size: 17px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .cb-guide-close {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--text-muted);
            padding: 0 4px;
            line-height: 1;
        }
        .cb-guide-close:hover {
            color: var(--text-primary);
        }
        .cb-guide-body {
            padding: 24px;
            overflow-y: auto;
            font-size: 15px;
            line-height: 1.7;
        }
        .cb-guide-body table {
            border-collapse: collapse;
            width: 100%;
            margin: 12px 0;
        }
        .cb-guide-body th, .cb-guide-body td {
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            text-align: left;
            font-size: 14px;
        }
        .cb-guide-body th {
            background: var(--border-light);
            font-weight: 600;
        }
        .cb-guide-body pre {
            background: #f6f8fa;
            border-radius: var(--radius-sm);
            padding: 14px;
            overflow-x: auto;
            font-size: 13px;
        }
        .cb-guide-body h2, .cb-guide-body h3, .cb-guide-body h4 {
            margin-top: 20px;
        }
    </style>
</head>
<body class="audit-only">
    <div class="audit-topbar">
        <div style="display:flex;align-items:center;gap:12px;">
            <span class="audit-topbar-brand">Discovery Agent</span>
            <div class="audit-topbar-links">
                <a href="{{ url_for('audit_home') }}" class="audit-topbar-btn">Audit Home</a>
            </div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
            {% if guide_html %}
            <button id="cb-guide-btn" class="audit-topbar-btn" type="button">Explanation on Checkpoint Structure</button>
            {% endif %}
            <button id="cb-logout-btn" class="audit-topbar-btn" type="button">Log out</button>
        </div>
    </div>

    {% if guide_html %}
    <div class="cb-guide-overlay" id="cb-guide-overlay">
        <div class="cb-guide-modal">
            <div class="cb-guide-header">
                <h2>Checkpoint Structure</h2>
                <button class="cb-guide-close" id="cb-guide-close" type="button">&times;</button>
            </div>
            <div class="cb-guide-body markdown-body">
                {{ guide_html }}
            </div>
        </div>
    </div>
    {% endif %}

    <div class="cb-layout">
        <div class="cb-sidebar" id="cb-sidebar">
            <div class="cb-sidebar-header">Checkpoints</div>
            <div id="cb-tree"></div>
        </div>
        <div class="cb-content" id="cb-content">
            <div class="cb-empty" id="cb-placeholder">Select a file to view its contents</div>
        </div>
    </div>

    <script>
    (function() {
        var treeEl = document.getElementById('cb-tree');
        var contentEl = document.getElementById('cb-content');
        var placeholderEl = document.getElementById('cb-placeholder');
        var activeItem = null;

        // Load tree
        fetch('/api/checkpoint_tree', { credentials: 'include' })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (!data.success) {
                    treeEl.innerHTML = '<div class="cb-error">' + (data.error || 'Failed to load') + '</div>';
                    return;
                }
                renderTree(data.tree, treeEl, 0);
            })
            .catch(function() {
                treeEl.innerHTML = '<div class="cb-error">Failed to load checkpoint tree</div>';
            });

        function renderTree(nodes, parentEl, depth) {
            nodes.forEach(function(node) {
                if (node.type === 'dir') {
                    var wrapper = document.createElement('div');

                    var item = document.createElement('div');
                    item.className = 'cb-tree-item';
                    item.style.paddingLeft = (12 + depth * 16) + 'px';

                    var toggle = document.createElement('span');
                    toggle.className = 'cb-tree-toggle';
                    toggle.textContent = '\u25B6';

                    var icon = document.createElement('span');
                    icon.className = 'cb-tree-icon';
                    icon.textContent = '\uD83D\uDCC1';

                    var label = document.createElement('span');
                    label.className = 'cb-tree-label';
                    label.textContent = node.name;

                    item.appendChild(toggle);
                    item.appendChild(icon);
                    item.appendChild(label);

                    var childContainer = document.createElement('div');
                    childContainer.className = 'cb-tree-children';

                    item.addEventListener('click', function() {
                        var isOpen = childContainer.classList.contains('open');
                        childContainer.classList.toggle('open');
                        toggle.classList.toggle('open');
                        icon.textContent = isOpen ? '\uD83D\uDCC1' : '\uD83D\uDCC2';
                    });

                    wrapper.appendChild(item);
                    wrapper.appendChild(childContainer);
                    parentEl.appendChild(wrapper);

                    if (node.children && node.children.length) {
                        renderTree(node.children, childContainer, depth + 1);
                    }
                } else {
                    var item = document.createElement('div');
                    item.className = 'cb-tree-item';
                    item.style.paddingLeft = (28 + depth * 16) + 'px';

                    var icon = document.createElement('span');
                    icon.className = 'cb-tree-icon';
                    icon.textContent = fileIcon(node.name);

                    var label = document.createElement('span');
                    label.className = 'cb-tree-label';
                    label.textContent = node.name;

                    item.appendChild(icon);
                    item.appendChild(label);

                    item.addEventListener('click', function() {
                        loadFile(node.path, item);
                    });

                    parentEl.appendChild(item);
                }
            });
        }

        function fileIcon(name) {
            var ext = name.lastIndexOf('.') >= 0 ? name.substring(name.lastIndexOf('.')) : '';
            if (ext === '.md') return '\uD83D\uDCC4';
            if (ext === '.json' || ext === '.yaml' || ext === '.yml') return '\u2699\uFE0F';
            if (ext === '.log') return '\uD83D\uDCCB';
            if (ext === '.py') return '\uD83D\uDC0D';
            return '\uD83D\uDCC4';
        }

        function loadFile(path, itemEl) {
            if (activeItem) activeItem.classList.remove('active');
            itemEl.classList.add('active');
            activeItem = itemEl;

            contentEl.innerHTML = '<div class="cb-loading">Loading\u2026</div>';

            fetch('/api/checkpoint_file?path=' + encodeURIComponent(path), { credentials: 'include' })
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    if (!data.success) {
                        contentEl.innerHTML = '<div class="cb-error">' + escapeHtml(data.error || 'Error') + '</div>';
                        return;
                    }
                    var html = '<div class="cb-breadcrumb">' + escapeHtml(path) + '</div>';
                    html += '<div class="cb-file-content">';

                    if (data.render === 'markdown') {
                        html += '<div class="markdown-body">' + (data.html || renderMarkdown(data.content)) + '</div>';
                    } else if (data.render === 'code') {
                        var ext = path.lastIndexOf('.') >= 0 ? path.substring(path.lastIndexOf('.') + 1) : '';
                        var langClass = ext === 'json' ? 'json' : ext === 'yaml' || ext === 'yml' ? 'yaml' : ext === 'py' ? 'python' : '';
                        html += '<pre><code class="language-' + langClass + '">' + escapeHtml(data.content) + '</code></pre>';
                    } else {
                        html += '<div class="cb-plain">' + escapeHtml(data.content) + '</div>';
                    }

                    html += '</div>';

                    if (data.truncated) {
                        html += '<div class="cb-truncated">File truncated at ' + data.truncated_at + ' lines. Download the full file for complete contents.</div>';
                    }

                    contentEl.innerHTML = html;

                    // Highlight code blocks
                    if (window.hljs) {
                        contentEl.querySelectorAll('pre code').forEach(function(el) {
                            hljs.highlightElement(el);
                        });
                    }
                })
                .catch(function() {
                    contentEl.innerHTML = '<div class="cb-error">Failed to load file</div>';
                });
        }

        function renderMarkdown(text) {
            if (window.marked) {
                try { return marked.parse(text); } catch(e) {}
            }
            return '<pre>' + escapeHtml(text) + '</pre>';
        }

        function escapeHtml(str) {
            var div = document.createElement('div');
            div.appendChild(document.createTextNode(str));
            return div.innerHTML;
        }

        // Guide modal
        var guideBtn = document.getElementById('cb-guide-btn');
        var guideOverlay = document.getElementById('cb-guide-overlay');
        var guideClose = document.getElementById('cb-guide-close');
        if (guideBtn && guideOverlay) {
            guideBtn.addEventListener('click', function() {
                guideOverlay.classList.add('open');
            });
            guideClose.addEventListener('click', function() {
                guideOverlay.classList.remove('open');
            });
            guideOverlay.addEventListener('click', function(e) {
                if (e.target === guideOverlay) guideOverlay.classList.remove('open');
            });
        }

        // Logout
        var logoutBtn = document.getElementById('cb-logout-btn');
        if (logoutBtn) {
            logoutBtn.addEventListener('click', function() {
                logoutBtn.disabled = true;
                fetch('/api/logout', { method: 'POST', credentials: 'include' })
                    .catch(function() {})
                    .then(function() { window.location.href = '/'; });
            });
        }
    })();
    </script>
</body>
</html>
