<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DiscoveryAgent Selection Website Guide</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .guide-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }
        .guide-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .markdown-body {
            line-height: 1.6;
        }
        .markdown-body h2 {
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid #e0e0e0;
        }
        .markdown-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
        }
        .markdown-body table th,
        .markdown-body table td {
            border: 1px solid #ddd;
            padding: 0.75rem;
            text-align: left;
        }
        .markdown-body table th {
            background-color: #f5f5f5;
            font-weight: 600;
        }
        .markdown-body code {
            background-color: #f5f5f5;
            padding: 0.2em 0.4em;
            border-radius: 3px;
            font-family: monospace;
            font-size: 0.9em;
        }
        .markdown-body ul, .markdown-body ol {
            padding-left: 2rem;
        }
    </style>
</head>
<body>
    <div class="guide-container">
        <header class="guide-header">
            <h1>DiscoveryAgent Selection Website Guide</h1>
            <p class="subtitle">Discovery Agent Hypothesis Selection UI</p>
        </header>

        <section class="section">
            <div class="card">
                <article class="markdown-body">
                    {% if error_message %}
                        <p>{{ error_message }}</p>
                    {% else %}
                        {{ guide_html | safe }}
                    {% endif %}
                </article>
            </div>
        </section>
    </div>
</body>
</html>
