[project]
name = "AIR"
version = "0.1.0"
description = "Automated Iterative Research (AIR) - AI-driven scientific discovery agent"
requires-python = ">=3.11"

dependencies = [
    # LLM providers
    "anthropic>=0.54.0",        # Anthropic Claude API + Bedrock support
    "openai>=1.50.0",           # OpenAI API; also used for OpenRouter (custom base_url)
    "together>=2.37.0,<3",      # v1 pins vulnerable Pillow <12; v2 retains chat API
    # Paperclip is the default deep-research provider. GXL distributes its
    # Python SDK as an official wheel rather than through the PyPI index.
    "gxl-paperclip==0.7.24",
    # 0.2.101+ is forward-compatible with informational CLI events such as
    # tool_progress and provides typed task lifecycle messages.
    "claude-agent-sdk>=0.2.101",

    # Notebook-based code execution
    "jupyter-client>=8.0.0",
    "jupyterlab>=4.4.0",
    "ipykernel>=6.29.0",
    "ipython>=9.0.0",
    "nbclient>=0.10.0",
    "nbconvert>=7.16.0",
    "nbformat>=5.10.0",

    # Data handling
    "lxml>=6.1.0,<7",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "xarray>=2026.1.0",
    "xmltodict>=0.14.0",

    # Data science / ML
    "imbalanced-learn>=0.14.0",
    "matplotlib>=3.8.0",
    "networkx>=3.4.0",
    "numba>=0.61.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    "seaborn>=0.13.0",
    "shap>=0.48.0",
    "sympy>=1.14.0",
    "tabulate>=0.9.0",
    "xgboost>=3.0.0",

    # Visualization
    "adjustText>=1.3.0",
    "matplotlib-venn>=1.1.0",
    "pillow>=12.3.0,<13",       # Patched image parsers for notebooks/reports
    "PyWavelets>=1.9.0",
    "UpSetPlot>=0.9.0",

    # Statistical modeling
    "autograd>=1.8.0",
    "autograd-gamma>=0.5.0",
    "choix>=0.4.0",
    "formulaic>=1.2.0",
    "pingouin>=0.5.0",
    "statsmodels>=0.14.0",

    # Web / scraping
    "Authlib>=1.6.0",
    "beautifulsoup4>=4.13.0",
    "gql>=3.5.0",
    "selenium>=4.30.0",
    "wget>=3.2",

    # PDF
    "PyMuPDF>=1.27.0",
    "pypandoc_binary>=1.16.0",
    "pypdf>=6.16.1,<7",

    # Utilities
    "aiohttp>=3.14.3,<4",        # Patched HTTP client response parsing
    "backoff>=2.2.0",
    "croniter>=6.0.0",
    "natsort>=8.4.0",
    "python-dotenv>=1.0.0",     # Load API keys from .env
    "pyyaml>=6.0.0",            # YAML config parsing
    "requests>=2.33.0,<3",      # Patched HTTP requests
    "termcolor>=2.0.0",         # Colored terminal output
    "validators>=0.34.0",
]

[project.optional-dependencies]
# Not used by product orchestration. macOS users opting into this toolbox
# must separately provide OpenMP (for example Homebrew libomp).
lightgbm = ["lightgbm>=4.6.0"]
# Interactive CLI mode (MCP server for Claude Code)
interactive = [
    "fastmcp>=2.14.7,<3",
]

# Census/ACS specialized agent
acs = [
    "aiolimiter>=1.1.0",
    "diskcache>=5.6.0",
    "ipumspy>=0.7.0",
    "redis>=7.1.0",
    "rich>=13.0.0",
    "tenacity>=8.0.0",
    "tqdm>=4.65.0",
]

# Open Targets specialized agent
opentargets = [
    "pyarrow>=14.0.0",
]

# Bioinformatics / life sciences
bio = [
    "anndata>=0.12.0",
    "biopython>=1.84",
    "biotite>=1.6.0",
    "biotraj>=1.2.0",
    "depmap>=0.4.0",
    "fair-esm>=2.0.0",
    "gseapy>=1.1.0",
    "h5py>=3.15.0",
    "lifelines>=0.30.0",
    "mdtraj>=1.11.0",
    "scanpy>=1.11.0",
    "zarr>=3.1.0",
]

# PyTorch and HuggingFace ecosystem
torch = [
    # datasets 4.1+ requires pyarrow>=21, which conflicts with ipumspy in the acs extra.
    "datasets>=4.0.0,<4.1.0",
    "huggingface_hub>=1.3.0",
    "safetensors>=0.7.0",
    "torch>=2.10.0",
    "torch-geometric>=2.7.0",
    "torchvision>=0.25.0",
    "transformers>=5.0.0",
]

# LangChain
langchain = [
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-text-splitters>=0.3.0",
]

# AWS (S3, Bedrock via boto3)
aws = [
    "boto3>=1.42.0",
]

# Astronomy / astrophysics
astronomy = [
    "astropy>=7.2.0",
    "astropy-iers-data>=0.2026.0",
    "astroquery>=0.4.11",
    "photutils>=2.3.0",
    "pyvo>=1.8.0",
]

# Natural language processing
nlp = [
    "nltk>=3.9.0",
    "rouge_score>=0.1.2",
]

# Topological data analysis
tda = [
    "gudhi>=3.11.0",
    "kmapper>=2.1.0",
    "persim>=0.3.0",
    "pynndescent>=0.6.0",
    "ripser>=0.6.0",
    "scikit-tda>=1.1.0",
    "tadasets>=0.2.0",
    "umap-learn>=0.5.0",
]

# Development and testing
dev = [
    "aioresponses>=0.7.0",
    "ipdb>=0.13.0",
    "pytest>=8.0.0",
]

# Install everything (except dev)
all = [
    "AIR[acs,astronomy,aws,bio,interactive,langchain,lightgbm,nlp,opentargets,tda,torch]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["AIR"]

[tool.uv.sources]
AIR = { path = ".", editable = true }
gxl-paperclip = { path = "vendor/gxl_paperclip-0.7.24-py3-none-any.whl" }
